name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# reusable gate workflow in getnodalia/foundation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: getnodalia/foundation/.github/workflows/rust-gate.yml@c37ef19e6bc213e3ebf3a281f1bf0f3fd7c5d495 # foundation main
    with:
      # Same nodalia-fonts commit as the release-*.yml workflows.
      fonts-repository: getnodalia/foundation
      fonts-ref: 7a66e2c6c6d60ac6417caef3e339e186d003b5b8
      timeout-minutes: 120
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libasound2-dev
