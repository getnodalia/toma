# Windows on ARM: package the ARM64 release the way the release-*.yml workflows do (cross-compiled on an x64
# runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner, run the CLI natively, and
# uninstall. Foundation's reusable workflow does the work. (A native ARM64 `cargo test` job is left out for
# now: Papel saw an intermittent access violation in egui UI tests there.)
name: Windows ARM64

# The package build takes about 15 minutes, so it runs nightly on main and on pushes to `release`
# rather than on every push to main: a dependency or runner-image change still shows up within a
# day. PRs that change the Windows packaging itself still run it.
on:
  schedule:
    - cron: "41 4 * * *"
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    uses: getnodalia/foundation/.github/workflows/windows-arm64.yml@c37ef19e6bc213e3ebf3a281f1bf0f3fd7c5d495 # foundation main
    with:
      app-name: toma
      cli-name: toma-cli
      fonts-repository: getnodalia/foundation
      fonts-ref: 7a66e2c6c6d60ac6417caef3e339e186d003b5b8 # nodalia/fonts
