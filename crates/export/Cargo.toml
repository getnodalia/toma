[package]
name = "toma-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
nodalia-audio = { workspace = true }
nodalia-jpeg = { git = "https://github.com/getnodalia/foundation", rev = "e80c73f55de372dfccd30869770dd848c3865864" }
nodalia-exr = { workspace = true }
nodalia-tga = { workspace = true }
nodalia-dpx = { workspace = true }
nodalia-video = { workspace = true }
toma-time = { workspace = true }
toma-frame = { workspace = true }
toma-color = { workspace = true }
toma-media = { workspace = true }
nodalia-media = { workspace = true, features = ["mxf"] }
toma-codecs = { workspace = true }
toma-project = { workspace = true }
toma-render = { workspace = true }
toma-audio-dsp = { workspace = true }
toma-geom = { workspace = true }
toma-text = { workspace = true }
toma-isobmff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
toma-testkit = { workspace = true }
