[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/getnodalia/toma"

[workspace.dependencies]
craft-psd = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "06496f5bf20988123d319f83f9a51523218c2173" }
# Shared bounded classic TIFF directory traversal.
craft-tiff = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "3b8e426a260695af840a2cd79a064d40778f939e" }
# Isolated YCbCr codec pin; DNG keeps its craft-raw/craft-tiff type identity.
craft-tiff-ycbcr = { package = "craft-tiff", version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "cca00b22bfae6e8aafdb47e122efc5137fee269a" }
# internal
toma-time = { path = "crates/time" }
toma-geom = { path = "crates/geom" }
toma-color = { path = "crates/color" }
toma-bitstream = { path = "crates/bitstream" }
toma-isobmff = { path = "crates/isobmff" }
toma-matroska = { path = "crates/matroska" }
toma-cfb = { path = "crates/cfb" }
toma-dng = { path = "crates/dng" }
toma-audio-dsp = { path = "crates/audio-dsp" }
toma-frame = { path = "crates/frame" }
toma-media = { path = "crates/media" }
toma-codecs = { path = "crates/codecs" }
toma-project = { path = "crates/project" }
toma-edit = { path = "crates/edit" }
toma-interchange = { path = "crates/interchange" }
toma-text = { path = "crates/text" }
toma-captions = { path = "crates/captions" }
toma-speech = { path = "crates/speech" }
toma-tts = { path = "crates/tts" }
toma-tts-text = { path = "crates/tts-text" }
toma-render = { path = "crates/render" }
toma-gpu = { path = "crates/gpu" }
toma-scopes = { path = "crates/scopes" }
toma-export = { path = "crates/export" }
toma-format = { path = "crates/format" }
toma-engine = { path = "crates/engine" }
toma-ui-egui = { path = "crates/ui-egui" }
toma-automation = { path = "crates/automation" }
toma-platform = { path = "crates/platform" }
toma-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2.5.8"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
roxmltree = "0.21"
# Shared OpenEXR ZIP chunk compressor.
craft-exr = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "82062077bba679ba5236e2d1a391f02d1533cbab" }
# DPX still reader, on the same commit as craft-media.
craft-dpx = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "82062077bba679ba5236e2d1a391f02d1533cbab" }
# Shared YUV4MPEG2 parser and frame index.
craft-jsonrpc = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "0c15f7c74913880da6bae5927b95f798c2ecf3c3", features = ["async-lines"] }
craft-fcproj-format = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "6bd1c3dc357f012ddb31c6799ad2e36a1596003d" }
craft-font-catalog = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "f01f6aca3afdf664b6c3e651e8e58caddc701c62", default-features = false }
craft-control-protocol = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "99d0a6eca48082183a9d125cb4ef1a1707576070" }
craft-y4m = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "25c7a8959cf70cf8c3f076d05baadb0990710569" }
# Shared lossless JPEG decoding for DNG.
craft-raw = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "3b8e426a260695af840a2cd79a064d40778f939e", default-features = false }
craft-tga = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "82062077bba679ba5236e2d1a391f02d1533cbab" }
# Shared OMF Bento container; its object model stays in Toma.
craft-aaf = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "b3643af6477326e840f86be78c89357f5308ba1d" }
craft-cfb = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "7f3fdc0dfebd03f33a241f91f916e9a78d3e5c93" }
craft-docpath = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "47107f660191de2f0b425569506f4daa4faadac9" }
# The audio codecs (AAC, AC-3, FLAC, MP1/MP2, Opus) and the containers come from craft-libs. Both
# are on one commit, so the types they share (CodecParams, ByteSource) are the same.
craft-media = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "82062077bba679ba5236e2d1a391f02d1533cbab", default-features = false }
craft-audio = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "82062077bba679ba5236e2d1a391f02d1533cbab", default-features = false, features = ["aac-decode", "aac-encode", "rayon", "ac3-decode", "mpa-decode", "mp3-decode", "decode-native", "symphonia", "opus-decode", "flac-encode", "mp3-encode"] }
# The video codecs (including H.264 encode, APV encode, ProRes, DNxHD / DNxHR and decoders), on the same commit as craft-media.
craft-video = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "82062077bba679ba5236e2d1a391f02d1533cbab", features = ["h264-decode", "h264-encode", "hevc-decode", "vp9-decode", "av1-decode", "vp8-decode", "mpeg2", "apv", "prores", "dnx", "threads"] }
# Exact time, EDL / ALE and the interchange report; serde for the project file's time fields.
craft-timeline = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "57288edafdc45552e30481cc649021de446abfa0", features = ["serde"] }
craft-captions = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "57288edafdc45552e30481cc649021de446abfa0" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "47107f660191de2f0b425569506f4daa4faadac9", features = ["serde", "native-windows"] }
# egui 0.37: bundled fonts are opt-in, and the monochrome symbol/emoji faces moved to their own
# feature. Toma paints ✔ ✓ ✖ ⚡ ⚠ ⚙ ♪ ☑ in panel chrome, so both features are part of the
# production font policy (system_fonts stays off).
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
# Resizable table columns (About ▸ Contributors / Models); no image loaders.
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# In-app updates from this app's GitHub releases, with the update windows for egui.
nodalia-update = { git = "https://github.com/getnodalia/nodalia-design", rev = "114848a2ff1a7c29c9a5432fb12e955fbe0aeef2", features = ["egui"] }
nodalia-theme = { git = "https://github.com/getnodalia/nodalia-design", rev = "44bfd0a37e6bd2837c473b4e5607b70e8d169e61" }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces at a fraction of full debug info's size;
# dependencies need none.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.toma-dng]
opt-level = 3

[profile.dev.package.craft-audio]
opt-level = 3

[profile.dev.package.craft-video]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.toma-audio-dsp]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Keep the complete egui family and native event bridge on reviewed fork commits.
[patch.crates-io]
ecolor = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/getnodalia/foundation", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
